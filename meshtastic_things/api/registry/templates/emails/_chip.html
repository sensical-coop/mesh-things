{% comment %}A status tag. tone: accent (coral), warning (amber), error (red) or neutral.{% endcomment %}<span style="display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;line-height:18px;{% if tone == 'warning' %}background:#fef3c7;color:#b45309;{% elif tone == 'error' %}background:#fdecec;color:#dc2626;{% elif tone == 'neutral' %}background:#f3f3f3;color:#4b4c4f;{% else %}background:#ffe2e5;color:#f14157;{% endif %}">{{ label }}</span>
