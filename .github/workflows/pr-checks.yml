name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_call:

env:
  COMPOSE_FILE: docker-compose.yml

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp env.example .env
      - run: docker compose build registry_api
      - run: docker compose up -d --wait postgres redis
      - run: >
          docker compose run --rm --no-deps -e REGISTRY__SECRET_KEY=ci-test-secret
          registry_api python manage.py test registry readings
      - name: Migrations match the models
        run: >
          docker compose run --rm --no-deps -e REGISTRY__SECRET_KEY=ci-test-secret
          registry_api python manage.py makemigrations --check --dry-run
      - if: always()
        run: docker compose down -v

  client-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: cp env.example .env
      - run: scripts/regen-client-schema.sh
      - name: The mesh-things snapshot and stub match the API
        run: >
          git diff --exit-code --
          server/mesh_things/src/mesh_things/client/openapi.json
          server/mesh_things/src/mesh_things/client/_namespaces.pyi
      - name: A schema change raises the mesh-things version
        run: scripts/check-client-version.sh "origin/${{ github.base_ref || 'main' }}"

  prod-settings-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp env.example .env
      - run: docker compose build registry_api
      - name: Both roles load the production settings
        run: |
          for role in registry_api readings_api; do
            echo "--- $role ---"
            docker compose run --rm --no-deps \
              -e REGISTRY__SECRET_KEY=ci-test-secret \
              -e READINGS__SECRET_KEY=ci-test-secret \
              "$role" python manage.py check
          done
      - name: Compose files are valid, base and dev overlay alike
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - Dockerfile
          - api/Dockerfile
          - flink/Dockerfile
          - quality_worker/Dockerfile
          - monitor/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f "server/${{ matrix.dockerfile }}" ./server

  dependency-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.1"
      - run: scripts/lock-deps.sh
      - name: The locks match the requirements they are compiled from
        run: git diff --exit-code -- 'server/requirements.lock' 'server/*/requirements.lock'

  root-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --require-hashes -r server/requirements.lock
      - run: pip install --no-deps ./server/mesh_things
      - run: pip install -r server/requirements-test.txt
      - run: pytest -q --ignore=api
        working-directory: server
