name: Dependency audit

# Weekly as well as on pull requests, so an advisory published against a pin that has
# not changed still fails a run.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lock: server/requirements.lock
          - lock: server/requirements-test.lock
          - lock: server/api/requirements.lock
          - lock: server/monitor/requirements.lock
          - lock: server/quality_worker/requirements.lock
          # apache-beam, which apache-flink 2.2 requires, caps httplib2 below 0.23 and
          # pyarrow below 17 (issue #70).
          - lock: server/flink/requirements.lock
            ignore: >-
              --ignore-vuln PYSEC-2026-3444
              --ignore-vuln PYSEC-2024-161
              --ignore-vuln PYSEC-2026-113
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      - run: >
          uvx pip-audit==2.10.1 -r "${{ matrix.lock }}" --require-hashes --disable-pip
          --progress-spinner off ${{ matrix.ignore }}
