name: CLA

on:
  issue_comment:
    types: [created]
  # pull_request_target so the check can comment and record signatures on pull requests from forks.
  # It never checks out the pull request's code.
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08  # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/sensical-coop/mesh-things/blob/main/CLA.md
          # Signatures are kept on their own branch, outside main's branch protection.
          branch: cla-signatures
          path-to-signatures: signatures/version1/cla.json
          allowlist: dependabot[bot],coderabbitai[bot]
