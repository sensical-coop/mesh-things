x-api-image: &api-image
  image: meshtastic-things/api:latest
  # To pull prebuilt images instead of building on the server: uncomment below,
  # comment `build:`, and re-enable the publish jobs in deploy.yml. Set TAG to a
  # commit sha
  # image: ghcr.io/sensical-coop/meshtastic-kafka/api:${TAG:-latest}
  build:
    context: ../meshtastic_things
    dockerfile: api/Dockerfile

x-registry-role: &registry-role
  <<: *api-image
  environment:
    DJANGO_SETTINGS_MODULE: api_project.settings.prod
    APP_ROLE: registry
  env_file: "../.env"
  restart: unless-stopped

services:
  registry_api:
    <<: *registry-role
    mem_limit: 512m
    container_name: registry-api
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - 127.0.0.1:${REGISTRY__PORT}:${REGISTRY__PORT}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${REGISTRY__PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # Reads Postgres as readings_ro
  # Serves without registry_api
  # Only what the read tier uses, never the whole .env: it must not hold registry's,
  # the writer's or EMQX's secrets.
  readings_api:
    <<: *api-image
    environment: &readings-env
      DJANGO_SETTINGS_MODULE: api_project.settings.prod
      APP_ROLE: readings
      READINGS__SECRET_KEY: ${READINGS__SECRET_KEY:-}
      READINGS__DEBUG: ${READINGS__DEBUG:-}
      READINGS__ALLOWED_HOSTS: ${READINGS__ALLOWED_HOSTS:-}
      READINGS__BEHIND_TLS: ${READINGS__BEHIND_TLS:-}
      READINGS__CORS_ORIGINS: ${READINGS__CORS_ORIGINS:-}
      READINGS__COOKIE_DOMAIN: ${READINGS__COOKIE_DOMAIN:-}
      READINGS__DB_DSN: ${READINGS__DB_DSN:-}
      READINGS__REDIS_URL: ${READINGS__REDIS_URL:-}
      GATEWAY__PUBLIC_URL: ${GATEWAY__PUBLIC_URL:-}
      INFLUX__URL: ${INFLUX__URL:-}
      INFLUX__TOKEN: ${INFLUX__TOKEN:-}
      INFLUX__ORG: ${INFLUX__ORG:-}
      INFLUX__BUCKET: ${INFLUX__BUCKET:-}
      INFLUX__ALARMS_BUCKET: ${INFLUX__ALARMS_BUCKET:-}
      INFLUX__ALARM_COUNTS_BUCKET: ${INFLUX__ALARM_COUNTS_BUCKET:-}
      INFLUX__ALARMS_RETENTION_DAYS: ${INFLUX__ALARMS_RETENTION_DAYS:-}
      READINGS__ARCHIVE_BUCKET: ${READINGS__ARCHIVE_BUCKET:-}
      READINGS__ARCHIVE_PREFIX: ${READINGS__ARCHIVE_PREFIX:-}
      READINGS__ARCHIVE_ENDPOINT_URL: ${READINGS__ARCHIVE_ENDPOINT_URL:-}
      READINGS__ARCHIVE_PUBLIC_ENDPOINT_URL: ${READINGS__ARCHIVE_PUBLIC_ENDPOINT_URL:-}
      READINGS__ARCHIVE_REGION: ${READINGS__ARCHIVE_REGION:-}
      READINGS__ARCHIVE_ACCESS_KEY: ${READINGS__ARCHIVE_ACCESS_KEY:-}
      READINGS__ARCHIVE_SECRET_KEY: ${READINGS__ARCHIVE_SECRET_KEY:-}
      READINGS__ARCHIVE_STS: ${READINGS__ARCHIVE_STS:-}
      READINGS__ARCHIVE_ROLE_ARN: ${READINGS__ARCHIVE_ROLE_ARN:-}
      READINGS__ARCHIVE_CREDENTIAL_TTL_S: ${READINGS__ARCHIVE_CREDENTIAL_TTL_S:-}
      READINGS__EXPORT_MAX_DAYS: ${READINGS__EXPORT_MAX_DAYS:-}
    restart: unless-stopped
    mem_limit: 512m
    container_name: readings-api
    command:
      ["gunicorn", "api_project.wsgi:application", "--bind", "0.0.0.0:${READINGS__PORT}", "--workers", "2"]
    depends_on:
      influxdb:
        condition: service_healthy
      influx_init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      registry_api:
        condition: service_healthy
    ports:
      - 127.0.0.1:${READINGS__PORT}:${READINGS__PORT}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${READINGS__PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # Builds exports into the archive bucket. Readings' environment, plus the one credential
  # that writes under exports/ and the mail settings to tell owners when one is ready.
  readings_export_worker:
    <<: *api-image
    profiles: ["full"]
    environment:
      <<: *readings-env
      READINGS__EXPORT_WORKER: "true"
      READINGS__EXPORT_ACCESS_KEY: ${READINGS__EXPORT_ACCESS_KEY:-}
      READINGS__EXPORT_SECRET_KEY: ${READINGS__EXPORT_SECRET_KEY:-}
      REGISTRY__EMAIL_BACKEND: ${REGISTRY__EMAIL_BACKEND:-}
      REGISTRY__EMAIL_HOST: ${REGISTRY__EMAIL_HOST:-}
      REGISTRY__EMAIL_PORT: ${REGISTRY__EMAIL_PORT:-}
      REGISTRY__EMAIL_HOST_USER: ${REGISTRY__EMAIL_HOST_USER:-}
      REGISTRY__EMAIL_HOST_PASSWORD: ${REGISTRY__EMAIL_HOST_PASSWORD:-}
      REGISTRY__EMAIL_USE_TLS: ${REGISTRY__EMAIL_USE_TLS:-}
      REGISTRY__EMAIL_USE_SSL: ${REGISTRY__EMAIL_USE_SSL:-}
      REGISTRY__DEFAULT_FROM_EMAIL: ${REGISTRY__DEFAULT_FROM_EMAIL:-}
    restart: unless-stopped
    mem_limit: 384m
    container_name: readings-export-worker
    depends_on:
      readings_api:
        condition: service_healthy
    command: ["python", "manage.py", "run_export_worker"]

  registry_device_consumer:
    <<: *registry-role
    mem_limit: 256m
    container_name: registry-device-consumer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      registry_api:
        condition: service_healthy
    command: ["python", "manage.py", "consume_device_sightings"]

  registry_gateway_discovery:
    <<: *registry-role
    mem_limit: 256m
    container_name: registry-gateway-discovery
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      registry_api:
        condition: service_healthy
    command: ["python", "manage.py", "consume_gateway_candidates"]

  registry_sensor_discovery_consumer:
    <<: *registry-role
    mem_limit: 256m
    container_name: registry-sensor-discovery-consumer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      registry_api:
        condition: service_healthy
    command: ["python", "manage.py", "consume_sensor_discovery"]

  registry_quality_alarms_consumer:
    <<: *registry-role
    mem_limit: 256m
    container_name: registry-quality-alarms-consumer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      registry_api:
        condition: service_healthy
    command: ["python", "manage.py", "consume_quality_alarms"]

  # Terms renewal notices, pausing lapsed sources, and deleting readings after the grace period.
  registry_data_lifecycle:
    <<: *registry-role
    mem_limit: 256m
    container_name: registry-data-lifecycle
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      influx_init:
        condition: service_completed_successfully
      registry_api:
        condition: service_healthy
    command: ["python", "manage.py", "run_data_lifecycle"]
