x-quality-worker-image: &quality-worker-image
  image: meshtastic-things/quality-worker:latest
  # Prebuilt alternative, disabled. See compose/api.yml.
  # image: ghcr.io/sensical-coop/meshtastic-kafka/quality-worker:${TAG:-latest}
  build:
    context: ../meshtastic_things
    dockerfile: quality_worker/Dockerfile

services:
  # full, or opt-in for lite: batch data-quality checks over InfluxDB
  # `--profile lite --profile quality`
  quality_worker:
    profiles: ["full", "quality"]
    mem_limit: 512m
    container_name: quality-worker
    <<: *quality-worker-image
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      influxdb:
        condition: service_healthy
      redis:
        condition: service_healthy
      registry_api:
        condition: service_healthy
    env_file: "../.env"
    restart: unless-stopped

  # Beat scheduler
  quality_worker_beat:
    profiles: ["full", "quality"]
    mem_limit: 256m
    container_name: quality-worker-beat
    <<: *quality-worker-image
    depends_on:
      redis:
        condition: service_healthy
      quality_worker:
        condition: service_started
    env_file: "../.env"
    restart: unless-stopped
    command: ["celery", "-A", "quality_worker.celery_app", "beat", "--loglevel=info"]
