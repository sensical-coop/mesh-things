x-pipeline-image: &pipeline-image
  image: meshtastic-things/pipeline:latest
  # Prebuilt alternative, disabled. See compose/api.yml.
  # image: ghcr.io/sensical-coop/meshtastic-kafka/pipeline:${TAG:-latest}
  build: ../meshtastic_things

x-bridge-member: &bridge-member
  <<: *pipeline-image
  mem_limit: 256m
  depends_on:
    kafka:
      condition: service_healthy
    kafka-topics-init:
      condition: service_completed_successfully
  env_file: "../.env"
  restart: unless-stopped
  expose:
    - ${MQTT_BRIDGE__HEALTH__PORT}
  command: ["mqtt_kafka_bridge"]
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:${MQTT_BRIDGE__HEALTH__PORT}/health"]
    interval: 1m30s
    timeout: 30s
    retries: 5
    start_period: 30s

services:
  # Members of the $share/<group>/ subscription.
  mqtt_kafka_bridge:
    <<: *bridge-member
    environment:
      MQTT_BRIDGE__CLIENT_ID: mesh-bridge-1

  # Extra capacity (off by default) `--profile bridge-pool`.
  mqtt_kafka_bridge_2:
    <<: *bridge-member
    profiles: ["bridge-pool"]
    environment:
      MQTT_BRIDGE__CLIENT_ID: mesh-bridge-2

  mqtt_kafka_bridge_3:
    <<: *bridge-member
    profiles: ["bridge-pool"]
    environment:
      MQTT_BRIDGE__CLIENT_ID: mesh-bridge-3

  influxdb_writer:
    mem_limit: 256m
    container_name: influxdb-writer
    <<: *pipeline-image
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      influxdb:
        condition: service_healthy
      influx_init:
        condition: service_completed_successfully
    env_file: "../.env"
    restart: unless-stopped
    ports:
      - 127.0.0.1:${INFLUXDB_WRITER__HEALTHCHECK_PORT}:${INFLUXDB_WRITER__HEALTHCHECK_PORT}
    command: ["kafka_influx_writer"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${INFLUXDB_WRITER__HEALTHCHECK_PORT}/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  # lite-only
  decode_consumer:
    profiles: ["lite"]
    mem_limit: 256m
    container_name: decode-consumer
    <<: *pipeline-image
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      registry_api:
        condition: service_healthy
    env_file: "../.env"
    restart: unless-stopped
    ports:
      - 127.0.0.1:${DECODE_CONSUMER__HEALTHCHECK_PORT}:${DECODE_CONSUMER__HEALTHCHECK_PORT}
    command: ["decode_consumer"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${DECODE_CONSUMER__HEALTHCHECK_PORT}/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  # full, or opt-in for lite: MQTT sinks
  # `--profile lite --profile sinks`
  sink_dispatcher:
    profiles: ["full", "sinks"]
    mem_limit: 256m
    container_name: sink-dispatcher
    <<: *pipeline-image
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
    env_file: "../.env"
    restart: unless-stopped
    ports:
      - 127.0.0.1:${SINK_DISPATCHER__HEALTHCHECK_PORT}:${SINK_DISPATCHER__HEALTHCHECK_PORT}
    command: ["sink_dispatcher"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SINK_DISPATCHER__HEALTHCHECK_PORT}/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  # full-only: the S3/Parquet archive
  s3_writer:
    profiles: ["full"]
    mem_limit: 384m
    container_name: s3-writer
    <<: *pipeline-image
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      # Absent when the archive is on an external S3.
      minio:
        condition: service_healthy
        required: false
    env_file: "../.env"
    restart: unless-stopped
    ports:
      - 127.0.0.1:${S3_WRITER__HEALTHCHECK_PORT}:${S3_WRITER__HEALTHCHECK_PORT}
    command: ["kafka_s3_writer"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${S3_WRITER__HEALTHCHECK_PORT}/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  # The bundled object store; left out when the archive is on an external S3.
  minio:
    profiles: ["minio"]
    mem_limit: 768m
    container_name: minio
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_WRITER__ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_WRITER__SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: the bucket, the read-only identity readings issues archive credentials
  # from, and the identity that writes exports. Idempotent, so it runs on every `up`.
  minio_init:
    profiles: ["minio"]
    mem_limit: 128m
    container_name: minio-init
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    env_file: "../.env"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$$S3_WRITER__ACCESS_KEY" "$$S3_WRITER__SECRET_KEY" >/dev/null
        mc mb --ignore-existing "local/$$S3_WRITER__BUCKET"
        if [ -z "$$READINGS__ARCHIVE_ACCESS_KEY" ]; then
          echo "READINGS__ARCHIVE_ACCESS_KEY not set - no archive reader created."
          exit 0
        fi
        cat > /tmp/archive-reader.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {"Effect": "Allow", "Action": ["s3:GetObject"], "Resource": ["arn:aws:s3:::$$S3_WRITER__BUCKET/*"]},
            {"Effect": "Allow", "Action": ["s3:ListBucket"], "Resource": ["arn:aws:s3:::$$S3_WRITER__BUCKET"]}
          ]
        }
        EOF
        mc admin policy create local archive-reader /tmp/archive-reader.json
        mc admin user add local "$$READINGS__ARCHIVE_ACCESS_KEY" "$$READINGS__ARCHIVE_SECRET_KEY"
        mc admin policy attach local archive-reader --user "$$READINGS__ARCHIVE_ACCESS_KEY" 2>/dev/null || true
        echo "Archive reader ready."
        # Exports are kept a day; the job that lists them expires at the same time.
        # The image has no grep, so the existing rules are matched with case.
        rules=$$(mc ilm rule ls --json "local/$$S3_WRITER__BUCKET" 2>/dev/null || true)
        case "$$rules" in
          *'"Prefix":"exports/"'*) ;;
          *) mc ilm rule add --prefix "exports/" --expire-days 1 "local/$$S3_WRITER__BUCKET" ;;
        esac
        if [ -z "$$READINGS__EXPORT_ACCESS_KEY" ]; then
          echo "READINGS__EXPORT_ACCESS_KEY not set - no export writer created."
          exit 0
        fi
        cat > /tmp/export-writer.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:PutObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"],
              "Resource": ["arn:aws:s3:::$$S3_WRITER__BUCKET/exports/*"]
            }
          ]
        }
        EOF
        mc admin policy create local export-writer /tmp/export-writer.json
        mc admin user add local "$$READINGS__EXPORT_ACCESS_KEY" "$$READINGS__EXPORT_SECRET_KEY"
        mc admin policy attach local export-writer --user "$$READINGS__EXPORT_ACCESS_KEY" 2>/dev/null || true
        echo "Export writer ready."

volumes:
  minio_data:
