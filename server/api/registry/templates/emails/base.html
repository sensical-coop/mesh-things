<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>{{ subject }}</title>
</head>
{% comment %}Inline styles only: many mail clients drop <style> blocks. Colours follow the console (OA tokens).{% endcomment %}
<body style="margin:0;padding:0;background:#f6f6f6;color:#1b1c1f;font-family:'Inter Tight',Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{ preheader }}</div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f6f6f6;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;">
        <tr>
          <td style="padding:0 4px 16px 4px;font-size:15px;font-weight:600;letter-spacing:-0.01em;color:#1b1c1f;">
            <span style="display:inline-block;width:8px;height:8px;border-radius:4px;background:#ff495f;margin-right:8px;vertical-align:middle;"></span>Mesh Things
          </td>
        </tr>
        <tr>
          <td style="background:#ffffff;border:1px solid #e4e4e5;border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,0.06);padding:32px;">
            {% block content %}{% endblock %}
          </td>
        </tr>
        <tr>
          <td style="padding:16px 4px 0 4px;font-size:12px;line-height:18px;color:#6d6d6d;">
            {% block footer %}{% endblock %}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
